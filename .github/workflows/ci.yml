name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests (${{ matrix.compiler }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - gcc
          - clang
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential clang curl patch pkg-config \
            libx11-dev libxrandr-dev libxi-dev libxext-dev \
            libgl1-mesa-dev libxcursor-dev libxinerama-dev \
            libwayland-dev libxkbcommon-dev
      - name: Run tests
        run: |
          make CC=${{ matrix.compiler }} \
            CFLAGS='-std=c99 -Wall -Wextra -Werror -O2 -pthread' test
      - name: Check generated files
        run: |
          git diff --check
          test -z "$(git status --porcelain --untracked-files=normal)"

  docs:
    name: Documentation gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # The truth gate compares each document against the last commit that
          # touched its anchors, so it needs real history, not a shallow clone.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Prose and truth gates
        run: make check-docs
      - name: Truth gate detail
        if: failure()
        run: node scripts/check-docs-truth.mjs --root .

  sanitizers:
    name: ASan and UBSan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential curl patch pkg-config \
            libx11-dev libxrandr-dev libxi-dev libxext-dev \
            libgl1-mesa-dev libxcursor-dev libxinerama-dev \
            libwayland-dev libxkbcommon-dev
      - name: Run sanitizer tests
        run: make CC=gcc test-sanitize

  performance:
    name: Streaming performance gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential curl patch pkg-config \
            libx11-dev libxrandr-dev libxi-dev libxext-dev \
            libgl1-mesa-dev libxcursor-dev libxinerama-dev \
            libwayland-dev libxkbcommon-dev
      - name: Run chunk benchmark
        run: make -s benchmark-chunks

  graphics-e2e:
    name: Hyprland graphics E2E
    if: vars.VOXELCRAFT_HYPRLAND_RUNNER == 'true'
    runs-on: [self-hosted, linux, hyprland]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential curl patch pkg-config \
            libx11-dev libxrandr-dev libxi-dev libxext-dev \
            libgl1-mesa-dev libxcursor-dev libxinerama-dev \
            libwayland-dev libxkbcommon-dev
      - name: Run graphics, debug, and polar E2E
        run: |
          make test-debug-graphics-e2e
          make test-chunk-diagnostics-e2e
          make test-polar-e2e
      - name: Run atmosphere, landform, and water-section E2E
        run: |
          make test-atmosphere-e2e
          make test-landform-planets-e2e
          make test-water-section-e2e
          make test-flat-baseline-e2e
          make test-debug-fields-e2e
      - name: Probe documented runtime names
        run: make docs-probe

  coverage:
    name: Coverage report
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install coverage dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential curl gcovr patch pkg-config \
            libx11-dev libxrandr-dev libxi-dev libxext-dev \
            libgl1-mesa-dev libxcursor-dev libxinerama-dev \
            libwayland-dev libxkbcommon-dev
      - name: Generate coverage
        run: make CC=gcc test-coverage
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            build/coverage/coverage.xml
            build/coverage/coverage.html

  release-check:
    name: Release package
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential curl patch pkg-config \
            libx11-dev libxrandr-dev libxi-dev libxext-dev \
            libgl1-mesa-dev libxcursor-dev libxinerama-dev \
            libwayland-dev libxkbcommon-dev
      - name: Run release gate
        run: make release-check
      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: voxelcraft-linux
          path: |
            dist/*.tar.gz
            dist/*.sha256
