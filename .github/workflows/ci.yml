name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

env:
  RAYLIB_VERSION: "5.5"

jobs:
  unit-tests:
    name: Unit tests (${{ matrix.compiler }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - gcc
          - clang
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential clang curl pkg-config \
            libasound2-dev libx11-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libglu1-mesa-dev libxcursor-dev \
            libxinerama-dev libwayland-dev libxkbcommon-dev
      - name: Install raylib
        run: sh scripts/setup-raylib-ci.sh
      - name: Run tests
        run: |
          make CC=${{ matrix.compiler }} \
            CFLAGS='-std=c99 -Wall -Wextra -Werror -O2 -pthread' test
      - name: Check generated files
        run: |
          git diff --check
          test -z "$(git status --porcelain --untracked-files=normal)"

  sanitizers:
    name: ASan and UBSan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential curl pkg-config \
            libasound2-dev libx11-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libglu1-mesa-dev libxcursor-dev \
            libxinerama-dev libwayland-dev libxkbcommon-dev
      - name: Install raylib
        run: sh scripts/setup-raylib-ci.sh
      - name: Run sanitizer tests
        run: make CC=gcc test-sanitize

  game-e2e:
    name: Headless game and screenshot
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential curl pkg-config python3 \
            xvfb xauth mesa-utils libasound2-dev libx11-dev libxrandr-dev \
            libxi-dev libgl1-mesa-dev libglu1-mesa-dev libxcursor-dev \
            libxinerama-dev libwayland-dev libxkbcommon-dev
      - name: Install raylib
        run: sh scripts/setup-raylib-ci.sh
      - name: Build game
        run: make CC=gcc CFLAGS='-std=c99 -Wall -Wextra -Werror -O2 -pthread' voxelcraft
      - name: Run scripted game test
        run: make test-e2e
      - name: Upload debug capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: game-e2e-capture
          path: screenshots/
          if-no-files-found: warn

  coverage:
    name: Coverage report
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install coverage dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential curl gcovr pkg-config \
            libasound2-dev libx11-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libglu1-mesa-dev libxcursor-dev \
            libxinerama-dev libwayland-dev libxkbcommon-dev
      - name: Install raylib
        run: sh scripts/setup-raylib-ci.sh
      - name: Generate coverage
        run: make CC=gcc test-coverage
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            build/coverage/coverage.xml
            build/coverage/coverage.html

  release-check:
    name: Release package
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential curl pkg-config \
            libasound2-dev libx11-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libglu1-mesa-dev libxcursor-dev \
            libxinerama-dev libwayland-dev libxkbcommon-dev
      - name: Install raylib
        run: sh scripts/setup-raylib-ci.sh
      - name: Run release gate
        run: make release-check
      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: voxelcraft-linux
          path: |
            dist/*.tar.gz
            dist/*.sha256
